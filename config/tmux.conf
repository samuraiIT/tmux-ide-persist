# Dedicated socket: leaves the user's normal tmux server untouched.
set -g mouse on
set -g history-limit 50000
set -g destroy-unattached off
set -s escape-time 100
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:Tc'
# Right click belongs to the IDE, never to tmux split/kill menus.
bind-key -n MouseDown3Pane run-shell -b true
bind-key -n M-MouseDown3Pane run-shell -b true
set -g status-left '[#S] '
set -g status-right '%H:%M'
